version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutritrack_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/app/database.db
    networks:
      - nutritrack_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutritrack_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.simplenamed.com
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nutritrack_net

  nginx:
    image: nginx:alpine
    container_name: nutritrack_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nutritrack_net

networks:
  nutritrack_net:
    driver: bridge

volumes:
  db_data:
    driver: local
