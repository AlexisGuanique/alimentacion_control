version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutritrack_backend
    restart: unless-stopped
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/database.db
    volumes:
      - db_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://34.29.59.97:8010
    container_name: nutritrack_frontend
    restart: unless-stopped
    ports:
      - "3010:3000"
    depends_on:
      - backend

volumes:
  db_data:
    driver: local
